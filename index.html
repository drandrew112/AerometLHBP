<!DOCTYPE html>
<html lang="en">
    <head>
        <title>AeroMet</title>
        <meta property="og:title" content="StbyATC's AeroMet" />
        <meta name="author" content="DookthorAndriss">
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://stbyatc.com/" />
        <meta property="og:image" content="https://stbyatc.com/app/assets/favicon.png" />
        <meta property="og:description" content="Use a professional weather window" />
        <meta name="theme-color" content="#0a1628">
        <meta name="darkreader-lock">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="/socket.io/socket.io.js"></script>

        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
        theme: {
            extend: {
                colors: {
                    'atc-bg': '#0a1628',
                    'atc-header': '#118011',
                    'atc-card': '#162544',
                    'atc-card-hover': '#263656',
                    'atc-card-red': '#441616',
                    'atc-card-red-hover': '#562626',
                    'atc-border': '#1e3a5f',
                    'atc-primary': '#2563eb',
                    'atc-primary-hover': '#3b82f6',
                    'atc-amber': '#ff8c00',
                    'atc-cyan': '#22d3ee',
                    'atc-green': '#4ade80',
                    'atc-red': '#f87171',
                    'atc-text': '#e2e8f0',
                    'atc-text-dim': '#64748b',
                    'atc-blue': '#8fc6f9',
                    'atc-blue-dim': '#8fc6f9dd',
                    'atis-white': '#f2f2f2ff',
                    'atis-green': '#4ade80',
                    'atis-yellow': '#fbbf24',
                    'atis-red': '#f87171',
                },
                fontFamily: {
                    'euroscope': ['EuroScope.ttf'],
                },
            }
        }
        }
        </script>

    </head>
    <body class="bg-atc-bg text-atc-text font-euroscope select-none min-h-screen">
        <!-- TOP BAR -->
        <div class="absolute top-0 left-0 right-0 h-[70px] bg-atc-header z-50 flex items-center px-6 text-lg tracking-wide">

            <!-- LEFT: STATION -->
            <div class="flex-1 font-bold text-xl ml-0 mr-[30px]">
                <span>AEROMET LHBP</span>
            </div>

            <!-- CENTER: QNH -->
            <div class="flex items-center gap-2 mr-[60px]">
                <span class="uppercase text-m">QNH</span>
                <div class="font-bold text-5xl rounded-sm shadow-inner">
                    <span id="QNH">----</span>
                </div>
            </div>

            <!-- WIND -->
            <div id="wind_div" class="flex items-center gap-2 ml-[30px] bg-black px-2 py-1">
                <span id="wind_dir" class="font-semibold text-4xl">---</span>
                <span class="text-sm">/</span>
                <span id="wind_spd" class="font-semibold text-4xl">--</span>
            </div>

            <!-- CONDITIONS -->
            <div class="flex-1 flex justify-end font-bold text-xl">
                <span id="conditions">---</span>
            </div>
        </div>

        <!-- Content -->
        <div class="absolute top-0 left-0 right-0 bottom-0 text-atc-text">
            <!-- Runways -->
            <div class="absolute inset-0 flex justify-between items-center px-20">

                <!-- ===== LEFT SIDE ===== -->
                <div class="flex flex-col justify-center gap-16">
                    <!-- 31L -->
                    <div class="flex items-center gap-6">
                        <div id="rwy-31L"
                            class="runway-box bg-gray-600 px-3 py-6 text-3xl font-bold cursor-pointer transition">
                            31L
                        </div>
                    </div>

                    <!-- 31R -->
                    <div class="flex items-center gap-6">
                        <div id="rwy-31R"
                            class="runway-box bg-gray-600 px-3 py-6 text-3xl font-bold cursor-pointer transition">
                            31R
                        </div>
                    </div>
                </div>

                <div class="flex-1 flex justify-center items-center relative scale-110">
                    <div class="relative w-72 h-72 border-2 border-atc-border rounded-full flex justify-center items-center bg-black/20">
                        
                        <span class="absolute top-2 font-bold text-atc-text-dim text-xs z-20">N</span>
                        <span class="absolute right-2 font-bold text-atc-text-dim text-xs z-20">E</span>
                        <span class="absolute bottom-2 font-bold text-atc-text-dim text-xs z-20">S</span>
                        <span class="absolute left-2 font-bold text-atc-text-dim text-xs z-20">W</span>
                        
                        <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 100 100">
                            <defs>
                                <line id="tick" x1="92" y1="50" x2="96" y2="50" stroke="currentColor" stroke-width="0.5" class="text-atc-border/60" />
                                <line id="tick-long" x1="88" y1="50" x2="96" y2="50" stroke="currentColor" stroke-width="0.8" class="text-atc-border" />
                            </defs>
                            <g>
                                <use href="#tick" transform="rotate(0 50 50)" />
                                <use href="#tick" transform="rotate(10 50 50)" />
                                <use href="#tick" transform="rotate(20 50 50)" />
                                <use href="#tick" transform="rotate(30 50 50)" />
                                <use href="#tick-long" transform="rotate(40 50 50)" />
                                <use href="#tick" transform="rotate(50 50 50)" />
                                <use href="#tick" transform="rotate(60 50 50)" />
                                <use href="#tick" transform="rotate(70 50 50)" />
                                <use href="#tick" transform="rotate(80 50 50)" />
                                <use href="#tick" transform="rotate(90 50 50)" />
                                <use href="#tick" transform="rotate(100 50 50)" />
                                <use href="#tick" transform="rotate(110 50 50)" />
                                <use href="#tick" transform="rotate(120 50 50)" />
                                <use href="#tick-long" transform="rotate(130 50 50)" />
                                <use href="#tick" transform="rotate(140 50 50)" />
                                <use href="#tick" transform="rotate(150 50 50)" />
                                <use href="#tick" transform="rotate(160 50 50)" />
                                <use href="#tick" transform="rotate(170 50 50)" />
                                <use href="#tick" transform="rotate(180 50 50)" />
                                <use href="#tick" transform="rotate(190 50 50)" />
                                <use href="#tick" transform="rotate(200 50 50)" />
                                <use href="#tick" transform="rotate(210 50 50)" />
                                <use href="#tick-long" transform="rotate(220 50 50)" />
                                <use href="#tick" transform="rotate(230 50 50)" />
                                <use href="#tick" transform="rotate(240 50 50)" />
                                <use href="#tick" transform="rotate(250 50 50)" />
                                <use href="#tick" transform="rotate(260 50 50)" />
                                <use href="#tick" transform="rotate(270 50 50)" />
                                <use href="#tick" transform="rotate(280 50 50)" />
                                <use href="#tick" transform="rotate(290 50 50)" />
                                <use href="#tick" transform="rotate(300 50 50)" />
                                <use href="#tick-long" transform="rotate(310 50 50)" />
                                <use href="#tick" transform="rotate(320 50 50)" />
                                <use href="#tick" transform="rotate(330 50 50)" />
                                <use href="#tick" transform="rotate(340 50 50)" />
                                <use href="#tick" transform="rotate(350 50 50)" />
                            </g>
                        </svg>

                        <div class="absolute w-2 h-44 bg-gray-700/50 rotate-[130deg] rounded-sm z-10">
                            <div class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-[1px] bg-gray-500/50 border-l border-dashed border-gray-400"></div>
                        </div>
                        
                        <svg id="wind-arrow" class="absolute w-full h-full transition-transform duration-1000 ease-in-out z-30" viewBox="0 0 100 100">
                            <polygon points="50,96 46,88 54,88" fill="#ff8c00" id="arrow-head" 
                                    transform="rotate(180 50 92)" />
                        </svg>

                        <div class="w-1 h-1 bg-atc-border rounded-full z-20"></div>
                    </div>
                </div>

                <!-- ===== RIGHT SIDE ===== -->
                <div class="flex flex-col justify-center gap-16">
                    <!-- 13R -->
                    <div class="flex items-center gap-6 flex-row-reverse">
                        <div id="rwy-13R"
                            class="runway-box bg-gray-600 px-3 py-6 text-3xl font-bold cursor-pointer transition">
                            13R
                        </div>
                    </div>

                    <!-- 13L -->
                    <div class="flex items-center gap-6 flex-row-reverse">
                        <div id="rwy-13L"
                            class="runway-box bg-gray-600 px-3 py-6 text-3xl font-bold cursor-pointer transition">
                            13L
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-white absolute bottom-0 left-0 right-0 p-4 text-m">
                <span id="metar" class="text-atc-blue text-s">Loading...</span><br/>
                <span id="taf"   class="text-atc-blue-dim text-s">Loading...</span><br/>
                <span id="atis"  class="text-atis-white text-s">Loading...</span>
            </div>

        </div>

        <script type="module" src="dist/main.js?v=1.0"></script>
    </body>
</html>
