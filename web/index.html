    <style>
        html, body {
            overflow: hidden;
        }

        .wind-rose {
            position: relative;
            width: 138px;
            height: 138px;
            border: 2px solid #1e3a5f;
            border-radius: 9999px;
            background: rgba(0, 0, 0, 0.16);
            flex-shrink: 0;
            overflow: visible;
        }

        .wind-rose .cardinal {
            display: none;
            position: absolute;
            z-index: 20;
            color: #64748b;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
        }

        .wind-rose .north { top: 9px; left: 50%; transform: translateX(-50%); }
        .wind-rose .east  { right: 9px; top: 50%; transform: translateY(-50%); }
        .wind-rose .south { bottom: 9px; left: 50%; transform: translateX(-50%); }
        .wind-rose .west  { left: 9px; top: 50%; transform: translateY(-50%); }

        .wind-rose .degree-label {
            position: absolute;
            z-index: 40;
            color: #64748b;
            font-size: 8px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            pointer-events: none;
        }

        .wind-rose .ticks {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .wind-rose .runway-axis {
            position: absolute;
            inset: 50% auto auto 50%;
            width: 2px;
            height: 104px;
            background: rgba(100, 116, 139, 0.38);
            border-left: 1px dashed rgba(156, 163, 175, 0.58);
            transform-origin: 50% 50%;
            margin-left: -1px;
            margin-top: -52px;
            border-radius: 2px;
        }

        .wind-rose .wind-arrow {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            transition: transform 700ms ease-in-out;
            pointer-events: none;
        }

        .wind-rose .wind-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 4px;
            height: 4px;
            margin-left: -2px;
            margin-top: -2px;
            background: #475569;
            border-radius: 9999px;
            z-index: 25;
        }

        .wind-rose .wind-readout {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 35;
            width: 100%;
            min-width: 0;
            text-align: center;
            color: #e2e8f0;
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 0.01em;
            white-space: nowrap;
            text-shadow: 0 1px 3px #000;
        }

        .wind-rose .wind-unit {
            display: inline;
            margin-top: 0;
            margin-left: 6px;
            color: #e2e8f0;
            font-size: 28px;
            font-weight: 900;
        }


        .runway-divider {
            grid-column: 1 / -1;
            height: 1px;
            background: #1e3a5f;
            opacity: 0.9;
            margin: 2px 0 2px;
        }

        .runway-row {
            display: flex;
            align-items: center;
            gap: 44px;
            min-width: 0;
        }

        .runway-row.left {
            justify-content: flex-start;
        }

        .runway-row.right {
            justify-content: flex-end;
        }

        .runway-box {
            min-width: 70px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .utc-clock {
            display: flex;
            align-items: baseline;
            gap: 1px;
            padding: 2px 8px;
            background: #e4c300;
            color: #142013;
            line-height: 1;
            align-items: center;
            font-variant-numeric: tabular-nums;
        }

        .utc-small {
            font-size: 1rem;
            font-weight: 700;
            opacity: 0.9;
            line-height: 1;
        }

        .utc-minute {
            font-size: 1.65rem;
            font-weight: 900;
            letter-spacing: 0.02em;
            line-height: 1;
        }

        .atis-letter-top {
            color: #ffe55b;
            font-weight: 800;
            font-size: 1.15rem;
            min-width: 34px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .wind-rose {
                width: 112px;
                height: 112px;
            }

            .wind-rose .runway-axis {
                height: 84px;
                margin-top: -42px;
            }

            .runway-box {
                min-width: 60px;
                min-height: 48px;
                font-size: 1.45rem;
            }
        }
    </style>

    <script>
        function updateUtcClock() {
            const now = new Date();
            const hh = String(now.getUTCHours()).padStart(2, "0");
            const mm = String(now.getUTCMinutes()).padStart(2, "0");
            const ss = String(now.getUTCSeconds()).padStart(2, "0");

            const h = document.getElementById("utc-hour");
            const m = document.getElementById("utc-minute");
            const sec = document.getElementById("utc-second");
            if (h) h.textContent = hh;
            if (m) m.textContent = mm;
            if (sec) sec.textContent = ss;
        }


        function renderDegreeLabels() {
            const labels = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
            document.querySelectorAll('.wind-rose').forEach(rose => {
                labels.forEach(deg => {
                    const label = document.createElement('span');
                    label.className = 'degree-label';
                    label.textContent = String(deg).padStart(3, '0');
                    const rad = (deg - 90) * Math.PI / 180;
                    const radius = 56;
                    const x = 50 + Math.cos(rad) * radius;
                    const y = 50 + Math.sin(rad) * radius;
                    label.style.left = `${x}%`;
                    label.style.top = `${y}%`;
                    label.style.transform = 'translate(-50%, -50%)';
                    rose.appendChild(label);
                });
            });
        }

        updateUtcClock();
        renderDegreeLabels();
        setInterval(updateUtcClock, 1000);
    </script>
